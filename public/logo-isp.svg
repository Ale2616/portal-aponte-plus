<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Fiber/Signal Icon Shield -->
  <g transform="translate(10, 8)">
    <rect width="44" height="44" rx="12" fill="url(#grad-icon)" />
    <!-- Optical fiber pulse lines -->
    <path d="M14 30 C 18 20, 26 20, 30 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <circle cx="30" cy="14" r="3.5" fill="#38bdf8" />
    <path d="M12 36 C 20 28, 24 24, 34 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
    <circle cx="34" cy="22" r="2.5" fill="#ffffff" />
    <circle cx="14" cy="30" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="currentColor" letter-spacing="-0.5">
    ANDES<tspan fill="#6366f1">FIBRA</tspan>
  </text>
  <text x="66" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="2">
    INTERNET DE ALTA VELOCIDAD
  </text>
</svg>
